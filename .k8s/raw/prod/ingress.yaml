apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipo-os
  namespace: default
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pipo-os.piposaude.com.br
  rules:
    - host: pipo-os.piposaude.com.br
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pipo-os-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pipo-os-web
                port:
                  number: 80
