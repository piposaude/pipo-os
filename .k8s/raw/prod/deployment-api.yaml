apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipo-os-api
  namespace: default
  labels:
    app: pipo-os-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pipo-os-api
  template:
    metadata:
      labels:
        app: pipo-os-api
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: pipo-os
      nodeSelector:
        serviceType: pipo-core-arm64
      tolerations:
        - key: dedicated
          operator: Equal
          value: pipo-core-arm64
          effect: NoSchedule
      containers:
        - name: pipo-os-api
          image: 588824502706.dkr.ecr.sa-east-1.amazonaws.com/services/pipo-os-api:IMAGE_TAG
          ports:
            - containerPort: 3001
            - containerPort: 8080
              name: metrics
          env:
            - name: NODE_ENV
              value: production
            - name: APP_ENV
              value: prod
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pipo-os-postgres
                  key: DATABASE_URL
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: pipo-os
                  key: SENTRY_DSN
            - name: APP_BASE_URL
              value: https://os.piposaude.com.br
            - name: AUTH_SERVICE_URL
              value: https://auth-service.piposaude.com.br
            - name: ALLOWED_EMAIL_DOMAINS
              value: piposaude.com.br,pipo.ai
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: pipo-os
                  key: COOKIE_SECRET
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pipo-os
                  key: GOOGLE_OAUTH_CLIENT_ID
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
