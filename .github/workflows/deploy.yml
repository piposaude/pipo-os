name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'

permissions:
  id-token: write
  contents: read

env:
  ECR_REGISTRY: 588824502706.dkr.ecr.sa-east-1.amazonaws.com
  ECR_REPOSITORY_API: services/pipo-os-api
  ECR_REPOSITORY_WEB: services/pipo-os-web
  AWS_REGION: sa-east-1

jobs:
  test:
    uses: ./.github/workflows/ci-checks.yml
    secrets: inherit

  # Tags mark a release cut promoted from a commit already validated on main,
  # so they always publish and deploy both images regardless of which paths
  # changed. Branch pushes only touch the app(s) whose paths actually changed.
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      # JSON array feeding `build`/`deploy`'s matrix, e.g. '["web"]' or '[]'.
      # A job-level `if` can't read the `matrix` context, so filtering has to
      # happen here, upstream, by shrinking the matrix itself.
      apps: ${{ steps.resolve.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        if: github.ref_type == 'branch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'Dockerfile.api'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'Dockerfile.web'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/deploy.yml'

      - id: resolve
        env:
          API_CHANGED: ${{ steps.filter.outputs.api }}
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            API=true
            WEB=true
          else
            API="$API_CHANGED"
            WEB="$WEB_CHANGED"
          fi
          apps=$(jq -nc --arg api "$API" --arg web "$WEB" \
            '[if $api == "true" then "api" else empty end, if $web == "true" then "web" else empty end]')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  context:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
      cluster: ${{ steps.set.outputs.cluster }}
      manifests-dir: ${{ steps.set.outputs.manifests-dir }}
      image-tag: ${{ steps.set.outputs.image-tag }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "cluster=pipo-prod" >> "$GITHUB_OUTPUT"
            echo "manifests-dir=.k8s/raw/prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "cluster=pipo-stag" >> "$GITHUB_OUTPUT"
            echo "manifests-dir=.k8s/raw/stag" >> "$GITHUB_OUTPUT"
          fi
          echo "image-tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & push ${{ matrix.app }} image
    needs: [test, context, changes]
    if: needs.changes.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_type == 'tag' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_STAG }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build & push (arm64)
        env:
          WEB_APP_SENTRY_DSN: ${{ secrets.WEB_APP_SENTRY_DSN }}
        run: |
          TAG="${{ needs.context.outputs.image-tag }}"
          if [[ "${{ matrix.app }}" == "api" ]]; then
            IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_API }}"
            BUILD_ARGS=()
          else
            IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_WEB }}"
            BUILD_ARGS=(--build-arg "WEB_APP_SENTRY_DSN=$WEB_APP_SENTRY_DSN")
          fi
          docker buildx build \
            --platform linux/arm64 \
            --file "Dockerfile.${{ matrix.app }}" \
            "${BUILD_ARGS[@]}" \
            --tag "$IMAGE:$TAG" \
            --push .
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            docker buildx build \
              --platform linux/arm64 \
              --file "Dockerfile.${{ matrix.app }}" \
              "${BUILD_ARGS[@]}" \
              --tag "$IMAGE:${{ github.ref_name }}" \
              --push .
          fi

  deploy-shared:
    name: Apply shared manifests
    needs: [context, changes]
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_type == 'tag' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_STAG }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.context.outputs.cluster }} \
            --region ${{ env.AWS_REGION }}

      # Recursos estáticos (sem IMAGE_TAG), compartilhados pelas duas apps:
      # aplicados uma única vez por deploy, independente de qual app mudou.
      - name: Apply shared resources
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          MANIFESTS="${{ needs.context.outputs.manifests-dir }}"
          export POSTGRES_PASSWORD_URLENC=$(jq -rn --arg v "$POSTGRES_PASSWORD" '$v|@uri')
          envsubst < "$MANIFESTS/postgres-secret.yaml.tmpl" | kubectl apply -f -
          envsubst < "$MANIFESTS/sentry-secret.yaml.tmpl" | kubectl apply -f -
          kubectl apply -f "$MANIFESTS/serviceaccount.yaml"
          kubectl apply -f "$MANIFESTS/postgres-crossplane.yaml"
          kubectl apply -f "$MANIFESTS/service-api.yaml" -f "$MANIFESTS/service-web.yaml"
          kubectl apply -f "$MANIFESTS/ingress.yaml"

  deploy:
    name: Deploy ${{ matrix.app }} to ${{ needs.context.outputs.cluster }}
    needs: [context, build, changes, deploy-shared]
    if: needs.changes.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_type == 'tag' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_STAG }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.context.outputs.cluster }} \
            --region ${{ env.AWS_REGION }}

      - name: Apply deployment
        run: |
          MANIFESTS="${{ needs.context.outputs.manifests-dir }}"
          sed -i "s|IMAGE_TAG|${{ needs.context.outputs.image-tag }}|g" \
            "$MANIFESTS/deployment-${{ matrix.app }}.yaml"
          kubectl apply -f "$MANIFESTS/deployment-${{ matrix.app }}.yaml"
          kubectl rollout restart "deployment/pipo-os-${{ matrix.app }}" -n default

      - name: Wait for rollout
        run: kubectl rollout status "deployment/pipo-os-${{ matrix.app }}" -n default --timeout=180s

      - name: Rollback on failure
        if: failure()
        run: kubectl rollout undo "deployment/pipo-os-${{ matrix.app }}" -n default
