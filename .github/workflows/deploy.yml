name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'

permissions:
  id-token: write
  contents: read

env:
  ECR_REGISTRY: 588824502706.dkr.ecr.sa-east-1.amazonaws.com
  ECR_REPOSITORY: services/pipo-os
  AWS_REGION: sa-east-1

jobs:
  test:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

  context:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
      cluster: ${{ steps.set.outputs.cluster }}
      manifests-dir: ${{ steps.set.outputs.manifests-dir }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "cluster=pipo-prod" >> "$GITHUB_OUTPUT"
            echo "manifests-dir=.k8s/raw/prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "cluster=pipo-stag" >> "$GITHUB_OUTPUT"
            echo "manifests-dir=.k8s/raw/stag" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & push image
    needs: [test, context]
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_type == 'tag' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_STAG }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - id: meta
        run: echo "image-tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push (arm64)
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}"
          TAG="${{ steps.meta.outputs.image-tag }}"
          docker buildx build \
            --platform linux/arm64 \
            --tag "$IMAGE:$TAG" \
            --push .
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            docker buildx build \
              --platform linux/arm64 \
              --tag "$IMAGE:${{ github.ref_name }}" \
              --push .
          fi

  deploy:
    name: Deploy to ${{ needs.context.outputs.cluster }}
    needs: [context, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_type == 'tag' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_STAG }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.context.outputs.cluster }} \
            --region ${{ env.AWS_REGION }}

      - name: Apply manifests
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          MANIFESTS="${{ needs.context.outputs.manifests-dir }}"
          sed -i "s|IMAGE_TAG|${{ needs.build.outputs.image-tag }}|g" "$MANIFESTS/deployment.yaml"
          envsubst < "$MANIFESTS/postgres-secret.yaml.tmpl" | kubectl apply -f -
          kubectl apply -f "$MANIFESTS/"
          kubectl rollout restart deployment/pipo-os -n default

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/pipo-os \
            -n default --timeout=180s

      - name: Rollback on failure
        if: failure()
        run: kubectl rollout undo deployment/pipo-os -n default
