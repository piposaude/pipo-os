name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'

permissions:
  id-token: write
  contents: read

env:
  ECR_REGISTRY: 588824502706.dkr.ecr.sa-east-1.amazonaws.com
  ECR_REPOSITORY_API: services/pipo-os-api
  ECR_REPOSITORY_WEB: services/pipo-os-web
  AWS_REGION: sa-east-1

jobs:
  test:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pipo_os
          POSTGRES_PASSWORD: pipo_os
          POSTGRES_DB: pipo_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pipo_os:pipo_os@localhost:5432/pipo_os
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

  context:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
      cluster: ${{ steps.set.outputs.cluster }}
      manifests-dir: ${{ steps.set.outputs.manifests-dir }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "cluster=pipo-prod" >> "$GITHUB_OUTPUT"
            echo "manifests-dir=.k8s/raw/prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "cluster=pipo-stag" >> "$GITHUB_OUTPUT"
            echo "manifests-dir=.k8s/raw/stag" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & push image
    needs: [test, context]
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_type == 'tag' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_STAG }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - id: meta
        run: echo "image-tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push (arm64)
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          TAG="${{ steps.meta.outputs.image-tag }}"
          for name in api web; do
            if [[ "$name" == "api" ]]; then
              IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_API }}"
              BUILD_ARGS=()
            else
              IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_WEB }}"
              BUILD_ARGS=(--build-arg "VITE_SENTRY_DSN=$VITE_SENTRY_DSN")
            fi
            docker buildx build \
              --platform linux/arm64 \
              --file "Dockerfile.$name" \
              "${BUILD_ARGS[@]}" \
              --tag "$IMAGE:$TAG" \
              --push .
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              docker buildx build \
                --platform linux/arm64 \
                --file "Dockerfile.$name" \
                "${BUILD_ARGS[@]}" \
                --tag "$IMAGE:${{ github.ref_name }}" \
                --push .
            fi
          done

  deploy:
    name: Deploy to ${{ needs.context.outputs.cluster }}
    needs: [context, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_type == 'tag' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_STAG }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.context.outputs.cluster }} \
            --region ${{ env.AWS_REGION }}

      - name: Apply manifests
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          MANIFESTS="${{ needs.context.outputs.manifests-dir }}"
          sed -i "s|IMAGE_TAG|${{ needs.build.outputs.image-tag }}|g" \
            "$MANIFESTS/deployment-api.yaml" "$MANIFESTS/deployment-web.yaml"
          envsubst < "$MANIFESTS/postgres-secret.yaml.tmpl" | kubectl apply -f -
          envsubst < "$MANIFESTS/sentry-secret.yaml.tmpl" | kubectl apply -f -
          kubectl apply -f "$MANIFESTS/"
          kubectl rollout restart deployment/pipo-os-api deployment/pipo-os-web -n default

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/pipo-os-api -n default --timeout=180s
          kubectl rollout status deployment/pipo-os-web -n default --timeout=180s

      - name: Rollback on failure
        if: failure()
        run: kubectl rollout undo deployment/pipo-os-api deployment/pipo-os-web -n default
