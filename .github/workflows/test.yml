name: Tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths-ignore:
      - 'docs/**'
      - '.claude/**'

jobs:
  test:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pipo_os
          POSTGRES_PASSWORD: pipo_os
          POSTGRES_DB: pipo_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pipo_os:pipo_os@localhost:5432/pipo_os
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm -r lint

      # Build antes de typecheck/test: packages/observability precisa do seu
      # dist/ compilado para que apps/api e apps/web resolvam seus exports.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Check openapi.json and api-client drift
        run: |
          pnpm --filter pipo-os-backend openapi:export
          pnpm --filter @pipo-os/api-client generate
          git diff --exit-code -- openapi.json packages/api-client/src/generated

      - name: Test
        run: pnpm -r test
