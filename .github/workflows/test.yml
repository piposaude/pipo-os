name: Tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths-ignore:
      - 'docs/**'
      - '.claude/**'

jobs:
  test:
    uses: ./.github/workflows/ci-checks.yml
    secrets: inherit
